<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
    </head>
    <body>
        <div class="main-container-s">
             <!--------------------------------------------SideBar--------------------------------->
            <div class="sidebar">
                <div class="top-section">
                    <img src="{{url_for('static',filename='logo.png')}}" alt="logo">
                    <span><font style="color: brown;">Expense </font><font style="color: rgb(53, 159, 201);">Tracker</font></span>
                </div>
                
                <div class="sections">
                    <span >
                        <a href="/home">Home</a>
                    </span>
                    <span>
                        <a href="/add">Add Expense</a>
                    </span>
                    <span>
                        <a href="/list" >List All Expenses</a>
                    </span>
                    <span class="active-list">
                        <a href="/summary">Summary Expenses</a>
                    </span>
                 
                </div>
            </div>
            <div class="content-s">
                <div class="top">
                    <span>Summary Expenses</span>
                </div>
                  <table>
                    {% for couple in data%}
                        <tr>
                            <td class="label-s">{{couple[0]}}</td>
                            <td class="data">{{couple[1]}} Dh</td>
                        </tr>
                    {%endfor%}
                    </table>
            </div>  
        </div>
    </body>
</html>
